name: Unzip project
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          Z=$(ls locallane-delivery-v*.zip | sort -V | tail -1)
          echo "Using $Z"
          unzip -q -o "$Z"
          cp -r locallane-delivery/. .
          rm -rf locallane-delivery locallane-delivery-v*.zip customer-site-patch
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Delivery update"
          git push
